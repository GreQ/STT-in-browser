<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech to Text</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Speech to Text</h1>
    <p class="intro">Speak into your microphone. The browser transcribes your speech and sends the text to this Flask app.</p>
    <label for="language">Recognition language</label>
    <select id="language">
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
      <option value="de-DE">Deutsch</option>
      <option value="fr-FR">Français</option>
      <option value="es-ES">Español</option>
    </select>
    <div class="controls">
      <button id="start" type="button">Start listening</button>
      <button id="stop" type="button" disabled>Stop</button>
    </div>
    <p id="status" role="status" aria-live="polite">Ready.</p>
    <label for="transcript">Transcript</label>
    <textarea id="transcript" rows="7" placeholder="Your recognized speech will appear here…"></textarea>
    <button id="send" type="button" class="send">Send transcript to backend</button>
    <pre id="response" aria-live="polite"></pre>
    <p class="note">Speech recognition availability depends on your browser. Allow microphone access when prompted.</p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <audio id="audio"></audio>
</body>
</html>
